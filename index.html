<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code.with_dj | Digital Clock</title>
    <style>
        /* Smooth reset for a professional look */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* Deep purple gradient background */
            background: linear-gradient(135deg, #0f021f 0%, #2a0845 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
        }

        /* Glassmorphism Card Effect */
        .clock-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(168, 85, 247, 0.2); /* Subtle purple border */
            border-radius: 24px;
            padding: 50px 40px 40px 40px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 
                        0 0 30px rgba(168, 85, 247, 0.15); /* Purple glow */
            position: relative;
            margin: 20px;
        }

        /* Your ID Badge */
        .user-badge {
            position: absolute;
            top: -18px;
            left: 50%;
            transform: translateX(-50%);
            background: #7e22ce; /* Rich purple */
            color: #fff;
            padding: 8px 24px;
            border-radius: 20px;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(126, 34, 206, 0.4);
            border: 1px solid #a855f7;
            white-space: nowrap;
        }

        /* The Time Display */
        #time {
            font-family: 'Courier New', Courier, monospace;
            font-size: clamp(3rem, 10vw, 5rem);
            font-weight: 700;
            color: #e9d5ff; 
            text-shadow: 0 0 10px #a855f7, 0 0 20px #a855f7, 0 0 40px #7e22ce; 
            margin-bottom: 15px;
            letter-spacing: 4px;
        }

        /* The Date Display */
        #date {
            font-size: 1.1rem;
            color: #d8b4fe; 
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 500;
        }

        /* Small hover effect on the card */
        .clock-card:hover {
            border-color: rgba(168, 85, 247, 0.5);
            transition: all 0.3s ease;
        }
    </style>
</head>
<body>

    <div class="clock-card">
        <div class="user-badge">Code.with_dj</div>
        <div id="time">00:00:00</div>
        <div id="date">Loading...</div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();

            // Format Time with Leading Zeros
            let hours = String(now.getHours()).padStart(2, '0');
            let minutes = String(now.getMinutes()).padStart(2, '0');
            let seconds = String(now.getSeconds()).padStart(2, '0');

            // Display Time
            document.getElementById('time').textContent = `${hours}:${minutes}:${seconds}`;

            // Format Date elegantly
            const options = { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' };
            document.getElementById('date').textContent = now.toLocaleDateString(undefined, options);
        }

        // Initialize and set to update every second
        updateClock();
        setInterval(updateClock, 1000);
    </script>

</body>
</html>
